[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lunacore"
version = "0.1.0"
description = "Multi-modal, sun-angle and scale invariant registration of Chandrayaan-2 imagery onto LRO base maps"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "opencv-python-headless>=4.8",   # needs cv2.USAC_MAGSAC (>= 4.5)
    "rasterio>=1.3",
    "requests>=2.31",
]

[project.optional-dependencies]
deep = ["torch>=2.1", "kornia>=0.7"]
pds4 = ["pds4_tools>=1.3"]
dev = ["pytest>=7"]

[project.scripts]
lunacore = "lunacore.cli:main"

[tool.setuptools]
packages = ["lunacore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
